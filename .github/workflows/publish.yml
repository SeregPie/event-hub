name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag
        required: false
        default: latest

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - run: bun run typecheck

      - run: bun run test

      - run: bun run build

      - name: Publish to npm
        working-directory: dist
        run: bun publish --access public --tag "$TAG"
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ inputs.tag }}
